name = "appreviewreply-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (set with `wrangler secret put NAME`; locally in .dev.vars):
#   OPENAI_API_KEY     - when PROVIDER = "openai" (default)
#   ANTHROPIC_API_KEY  - when PROVIDER = "anthropic"
#   APP_SECRET         - shared secret embedded in the Android app (beta-grade; replace with Play Integrity later)

[vars]
PROVIDER = "openai"
MODEL = "gpt-4o-mini"
# For PROVIDER = "anthropic": MODEL = "claude-opus-5", FALLBACK_MODEL = "claude-opus-4-8"
MONTHLY_CAP = "500"
MAX_REPLY_CHARS = "350"

# KV namespace for per-user monthly counters. Create with:
#   wrangler kv namespace create LIMITS
# then paste the id below.
[[kv_namespaces]]
binding = "LIMITS"
id = "b8b01af8f39148e0960ec097f0e919b0"
